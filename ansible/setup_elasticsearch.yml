---
- name: Set up Elasticsearch
  hosts: "{{ target_hosts | default('localhost') }}"
  connection: "{{ 'local' if (target_hosts | default('localhost') == 'localhost') else ansible_connection | default('ssh') }}"
  tasks:
    - name: Ensure variables are loaded
      include_vars:
        file: group_vars/all.yml

    - name: "Step 0 - WSL2 Tuning and Optimization"
      include_tasks: tasks/wsl_tuning.yml
      when: deployment_option == 'wsl2'

    - name: "Step 1 - Check and Install Podman and Podman Compose"
      block:
        - name: Check if podman or podman-compose are missing
          command: which {{ item }}
          loop:
            - podman
            - podman-compose
          register: commands_check
          ignore_errors: true
          changed_when: false

        - name: Set missing command flag
          set_fact:
            commands_missing: "{{ commands_check.results | selectattr('rc', 'ne', 0) | list | length > 0 }}"

        - name: Install dependencies on Debian/Ubuntu
          block:
            - name: Update apt cache
              apt:
                update_cache: yes
              become: true

            - name: Install podman and podman-compose via apt
              apt:
                name:
                  - podman
                  - podman-compose
                state: present
              become: true
              register: apt_install_result

            - name: Check if apt installation failed
              fail:
                msg: "Failed to install required podman and podman-compose packages via apt."
              when: apt_install_result.failed | default(false)
          when:
            - commands_missing
            - ansible_os_family == 'Debian'

        - name: Install dependencies on RedHat/CentOS/AlmaLinux
          block:
            - name: Install EPEL release via dnf
              dnf:
                name: epel-release
                state: present
              become: true
              register: epel_install_result
              failed_when: false

            - name: Install podman and podman-compose via dnf
              dnf:
                name:
                  - podman
                  - podman-compose
                state: present
              become: true
              register: dnf_install_result

            - name: Check if dnf installation failed
              fail:
                msg: "Failed to install required podman and podman-compose packages via dnf."
              when: dnf_install_result.failed | default(false)
          when:
            - commands_missing
            - ansible_os_family == 'RedHat'

    - name: "Step 1.5 - Verify Podman and Compose are available"
      command: which {{ item }}
      loop:
        - podman
        - podman-compose
      changed_when: false

    - name: "Step 2 - Create Data Directory"
      block:
        - name: Check if data directory already exists
          stat:
            path: "{{ data_dir }}"
          register: data_dir_stat
          when: deployment_option != 'wsl2'

        - name: Abort if data directory exists
          fail:
            msg: "Data directory '{{ data_dir }}' already exists. Aborting installation. Please back up any important data, delete or move it, and run the script again."
          when: deployment_option != 'wsl2' and data_dir_stat.stat.exists and not data_dir_stat.stat.isdir

        - name: Create data directories (Single Node)
          file:
            path: "{{ item }}"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0755"
          become: true
          loop:
            - "/data"
            - "{{ data_dir }}"
          when: deployment_option != 'wsl2'

        - name: Create data directories (WSL 3-Node Cluster)
          file:
            path: "{{ item }}"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0755"
          become: true
          loop:
            - "/opt/dsom-persistence"
            - "/opt/dsom-persistence/data"
            - "/opt/dsom-persistence/data/es-node-01"
            - "/opt/dsom-persistence/data/es-node-02"
            - "/opt/dsom-persistence/data/es-node-03"
          when: deployment_option == 'wsl2'

    - name: "Step 3 - Pull Elasticsearch Docker Image"
      command: podman pull "{{ elasticsearch_image }}"

    - name: "Step 4 - Optional: Install and Verify Cosign"
      block:
        - name: Check if cosign is installed
          command: which cosign
          register: cosign_check
          ignore_errors: true
          changed_when: false

        - name: Verify image with cosign
          block:
            - name: Download Elastic public key
              get_url:
                url: https://artifacts.elastic.co/cosign.pub
                dest: /tmp/cosign.pub
                mode: "0644"

            - name: Run cosign verify
              command: cosign verify --key /tmp/cosign.pub "{{ elasticsearch_image }}"

            - name: Clean up public key
              file:
                path: /tmp/cosign.pub
                state: absent
          when: cosign_check.rc == 0

    - name: "Step 5 - Start Elasticsearch Container using podman-compose"
      block:
        - name: Ensure ELK directory exists
          file:
            path: "{{ elk_dir }}"
            state: directory
            mode: "0755"

        - name: Create podman-compose.yml for Elasticsearch (Single Node)
          copy:
            content: |
              version: '3.8'
              services:
                elasticsearch:
                  image: {{ elasticsearch_image }}
                  container_name: {{ container_name }}
                  restart: unless-stopped
                  networks:
                    - elastic
                  ports:
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9200:9200"
                  environment:
                    - discovery.type=single-node
                  mem_limit: 1GB
                  volumes:
                    - "{{ data_dir }}:/usr/share/elasticsearch/data"
              networks:
                elastic:
                  driver: bridge
            dest: "{{ elk_dir }}/podman-compose.yml"
            mode: "0600"
          when: deployment_option != 'wsl2'

        - name: Check if credentials file already exists
          stat:
            path: "{{ temp_credentials_file }}"
          register: pre_creds_stat

        - name: Read existing elastic password if file exists
          shell: "grep \"Elastic password set to:\" \"{{ temp_credentials_file }}\" | sed 's/.*Elastic password set to: //' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'"
          register: pre_es_password_grep
          changed_when: false
          failed_when: false
          no_log: true
          when: pre_creds_stat.stat.exists

        - name: Generate or set initial elastic password fact
          set_fact:
            elastic_password: "{{ pre_es_password_grep.stdout | trim if (pre_creds_stat.stat.exists and pre_es_password_grep.stdout | trim | length > 0) else lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=20') }}"
          no_log: true

        - name: Create podman-compose.yml for Elasticsearch (WSL 3-Node Cluster)
          copy:
            dest: "{{ elk_dir }}/podman-compose.yml"
            mode: "0600"
            content: |
              version: '3.8'
              services:
                setup:
                  image: {{ elasticsearch_image }}
                  container_name: dsom-persistence-setup
                  volumes:
                    - certs:/usr/share/elasticsearch/config/certs
                  user: "0"
                  command: >
                    bash -c '
                      if [ ! -f config/certs/ca.zip ]; then
                        bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
                        unzip config/certs/ca.zip -d config/certs;
                      fi;
                      if [ ! -f config/certs/certs.zip ]; then
                        echo -ne "instances:\n" > config/certs/instances.yml;
                        echo -ne "  - name: es-node-01\n    dns:\n      - es-node-01\n      - localhost\n    ip:\n      - 127.0.0.1\n" >> config/certs/instances.yml;
                        echo -ne "  - name: es-node-02\n    dns:\n      - es-node-02\n      - localhost\n    ip:\n      - 127.0.0.1\n" >> config/certs/instances.yml;
                        echo -ne "  - name: es-node-03\n    dns:\n      - es-node-03\n      - localhost\n    ip:\n      - 127.0.0.1\n" >> config/certs/instances.yml;
                        bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
                        unzip config/certs/certs.zip -d config/certs;
                      fi;
                      chown -R 1000:1000 config/certs;
                      chmod -R 750 config/certs;
                    '
                es-node-01:
                  image: {{ elasticsearch_image }}
                  container_name: dsom-persistence-es-node-01
                  restart: unless-stopped
                  networks:
                    - elastic
                  ports:
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9200:9200"
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9300:9300"
                  environment:
                    - node.name=es-node-01
                    - cluster.name=dsom-wsl-cluster
                    - cluster.initial_master_nodes=es-node-01,es-node-02,es-node-03
                    - discovery.seed_hosts=es-node-02,es-node-03
                    - ELASTIC_PASSWORD={{ elastic_password }}
                    - xpack.security.enabled=true
                    - xpack.security.http.ssl.enabled=true
                    - xpack.security.http.ssl.key=certs/es-node-01/es-node-01.key
                    - xpack.security.http.ssl.certificate=certs/es-node-01/es-node-01.crt
                    - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.enabled=true
                    - xpack.security.transport.ssl.key=certs/es-node-01/es-node-01.key
                    - xpack.security.transport.ssl.certificate=certs/es-node-01/es-node-01.crt
                    - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.verification_mode=certificate
                  volumes:
                    - certs:/usr/share/elasticsearch/config/certs
                    - /opt/dsom-persistence/data/es-node-01:/usr/share/elasticsearch/data
                  mem_limit: 1GB

                es-node-02:
                  image: {{ elasticsearch_image }}
                  container_name: dsom-persistence-es-node-02
                  restart: unless-stopped
                  networks:
                    - elastic
                  ports:
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9201:9200"
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9301:9300"
                  environment:
                    - node.name=es-node-02
                    - cluster.name=dsom-wsl-cluster
                    - cluster.initial_master_nodes=es-node-01,es-node-02,es-node-03
                    - discovery.seed_hosts=es-node-01,es-node-03
                    - ELASTIC_PASSWORD={{ elastic_password }}
                    - xpack.security.enabled=true
                    - xpack.security.http.ssl.enabled=true
                    - xpack.security.http.ssl.key=certs/es-node-02/es-node-02.key
                    - xpack.security.http.ssl.certificate=certs/es-node-02/es-node-02.crt
                    - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.enabled=true
                    - xpack.security.transport.ssl.key=certs/es-node-02/es-node-02.key
                    - xpack.security.transport.ssl.certificate=certs/es-node-02/es-node-02.crt
                    - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.verification_mode=certificate
                  volumes:
                    - certs:/usr/share/elasticsearch/config/certs
                    - /opt/dsom-persistence/data/es-node-02:/usr/share/elasticsearch/data
                  mem_limit: 1GB

                es-node-03:
                  image: {{ elasticsearch_image }}
                  container_name: dsom-persistence-es-node-03
                  restart: unless-stopped
                  networks:
                    - elastic
                  ports:
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9202:9200"
                    - "{{ elasticsearch_bind_address | default('127.0.0.1') }}:9302:9300"
                  environment:
                    - node.name=es-node-03
                    - cluster.name=dsom-wsl-cluster
                    - cluster.initial_master_nodes=es-node-01,es-node-02,es-node-03
                    - discovery.seed_hosts=es-node-01,es-node-02
                    - ELASTIC_PASSWORD={{ elastic_password }}
                    - xpack.security.enabled=true
                    - xpack.security.http.ssl.enabled=true
                    - xpack.security.http.ssl.key=certs/es-node-03/es-node-03.key
                    - xpack.security.http.ssl.certificate=certs/es-node-03/es-node-03.crt
                    - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.enabled=true
                    - xpack.security.transport.ssl.key=certs/es-node-03/es-node-03.key
                    - xpack.security.transport.ssl.certificate=certs/es-node-03/es-node-03.crt
                    - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
                    - xpack.security.transport.ssl.verification_mode=certificate
                  volumes:
                    - certs:/usr/share/elasticsearch/config/certs
                    - /opt/dsom-persistence/data/es-node-03:/usr/share/elasticsearch/data
                  mem_limit: 1GB

              volumes:
                certs:
              networks:
                elastic:
                  name: {{ network_name }}
                  driver: bridge
          no_log: true
          when: deployment_option == 'wsl2'

        - name: Start Elasticsearch service
          command: podman-compose -p {{ compose_project_name }} up -d
          args:
            chdir: "{{ elk_dir }}"

    - name: "Step 6 - Retrieve and Store Elasticsearch Password"
      block:
        - name: Wait for Elasticsearch to start
          pause:
            seconds: 60

        - name: Check if credentials file exists
          stat:
            path: "{{ temp_credentials_file }}"
          register: creds_file_stat

        - name: Read existing elastic password if file exists
          shell: "grep \"Elastic password set to:\" \"{{ temp_credentials_file }}\" | sed 's/.*Elastic password set to: //' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'"
          register: es_password_grep
          changed_when: false
          failed_when: false
          no_log: true
          when: creds_file_stat.stat.exists

        - name: Set existing password fact
          set_fact:
            existing_elastic_password: "{{ es_password_grep.stdout | trim if (creds_file_stat.stat.exists and es_password_grep.stdout is defined) else (elastic_password | default('')) }}"
          no_log: true

        - name: Check if existing password works
          uri:
            url: https://localhost:9200
            user: elastic
            password: "{{ existing_elastic_password }}"
            force_basic_auth: yes
            ca_path: "{{ cert_dir }}/http_ca.crt"
            validate_certs: yes
          register: auth_check
          failed_when: false
          no_log: true
          when:
            - existing_elastic_password | length > 0
            - lookup('file', cert_dir ~ '/http_ca.crt', errors='ignore') is not none

        - name: Determine if password reset is needed
          set_fact:
            password_reset_needed: "{{ true if (existing_elastic_password | length == 0 or auth_check is skipped or (auth_check.status is defined and auth_check.status != 200)) else false }}"

        - name: Initialize temporary credentials file if reset needed
          copy:
            content: |
              --- Step 6: Retrieve and Store Elasticsearch Password ---
              {{ ansible_date_time.iso8601 | default('N/A') }}
            dest: "{{ temp_credentials_file }}"
            mode: "0600"
          when: password_reset_needed

        - name: Reset elastic user password if needed
          command: podman exec {{ container_name }} /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic -a -f -b
          register: password_output
          no_log: true
          when: password_reset_needed

        - name: Parse and set new elastic password fact
          set_fact:
            elastic_password: "{{ password_output.stdout | regex_search('New value: (.*)', '\\1') | first | trim }}"
          no_log: true
          when: password_reset_needed

        - name: Save new elastic password to file
          lineinfile:
            path: "{{ temp_credentials_file }}"
            line: "Elastic password set to: {{ elastic_password }}"
            create: yes
          no_log: true
          when: password_reset_needed

        - name: Set elastic password fact from existing password
          set_fact:
            elastic_password: "{{ existing_elastic_password }}"
          no_log: true
          when: not password_reset_needed

    - name: "Step 7 - Copy SSL Certificate"
      block:
        - name: Check and clean certificate directory
          file:
            path: "{{ cert_dir }}"
            state: "{{ item }}"
            mode: "0755"
          loop:
            - absent
            - directory

        - name: Copy http_ca.crt from container (Single Node)
          command: podman cp {{ container_name }}:/usr/share/elasticsearch/config/certs/http_ca.crt {{ cert_dir }}/http_ca.crt
          when: deployment_option != 'wsl2'

        - name: Copy http_ca.crt from container (WSL 3-Node Cluster)
          command: podman cp {{ container_name }}:/usr/share/elasticsearch/config/certs/ca/ca.crt {{ cert_dir }}/http_ca.crt
          when: deployment_option == 'wsl2'

    - name: "Step 8 - Make REST API Call"
      block:
        - name: Verify Elasticsearch readiness
          uri:
            url: https://localhost:9200
            user: elastic
            password: "{{ elastic_password }}"
            force_basic_auth: yes
            ca_path: "{{ cert_dir }}/http_ca.crt"
            validate_certs: yes
            status_code: 200
          register: es_readiness
          until: "es_readiness.status == 200"
          retries: 30
          delay: 2
          no_log: true

        - name: Print readiness response
          debug:
            var: es_readiness.content
          no_log: true

    - name: "Step 9 - Retrieve and Clean Kibana Enrollment Token"
      block:
        - name: Create Kibana enrollment token
          command: podman exec {{ container_name }} /usr/share/elasticsearch/bin/elasticsearch-create-enrollment-token -s kibana
          register: token_output
          no_log: true

        - name: Parse enrollment token
          shell: echo "{{ token_output.stdout }}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          register: parsed_token
          changed_when: false
          no_log: true

        - name: Save enrollment token to file
          lineinfile:
            path: "{{ temp_credentials_file }}"
            line: "Kibana enrollment token: {{ parsed_token.stdout | trim }}"
            create: yes
          no_log: true

        - name: Output final success message
          debug:
            msg:
              - "Elasticsearch setup complete! Access it at https://localhost:9200."
              - "Credentials saved in {{ temp_credentials_file }}"
