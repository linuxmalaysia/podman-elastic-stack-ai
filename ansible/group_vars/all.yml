---
# ==============================================================================
# Deployment Selection Options
# ==============================================================================
# Supported Options:
# - 'wsl2'         - Windows 11 Linux WSL2 environment (min 3 podman nodes/pods)
# - 'single_node'  - Single hardware or single VM environment (3 podman pods/nodes)
# - 'multi_node'   - Multiple/dedicated hardware or VM environments (dedicated podman nodes/pods)
# - 'jules'        - Special dedicated option for Google Jules environment
deployment_option: "wsl2"

# Target hosts for playbook run. Defaults to 'localhost'.
target_hosts: "localhost"

# Configurable Bind Addresses
elasticsearch_bind_address: "{{ '127.0.0.1' if (deployment_option == 'wsl2' or deployment_option == 'jules') else '0.0.0.0' }}"
kibana_bind_address: "{{ '127.0.0.1' if (deployment_option == 'wsl2' or deployment_option == 'jules') else '0.0.0.0' }}"
fleet_server_bind_address: "{{ '127.0.0.1' if (deployment_option == 'wsl2' or deployment_option == 'jules') else '0.0.0.0' }}"

elk_version: "9.4.4"
elk_base_dir: "{{ playbook_dir | dirname }}"
elk_dir: "{{ elk_base_dir }}/elk-wolfi"
cert_dir: "{{ elk_dir }}/certs"
container_name: "{{ 'dsom-persistence-es-node-01' if (deployment_option == 'wsl2') else 'es01' }}"
data_dir: "/data/{{ container_name }}"
elasticsearch_image: "docker.elastic.co/elasticsearch/elasticsearch-wolfi:{{ elk_version }}"
kibana_image_name: "docker.elastic.co/kibana/kibana-wolfi"
kibana_container_name: "{{ 'dsom-kibana-kibana-local' if (deployment_option == 'wsl2') else 'kib01' }}"
kibana_port: "5601"
compose_project_name: "elk-wolfi"
network_name: "{{ compose_project_name }}_elastic"
temp_credentials_file: "{{ elk_dir }}/temp_credentials.txt"

fleet_server_image_name: "docker.elastic.co/elastic-agent/elastic-agent-complete-wolfi"
fleet_server_container_name: "fleet-server"
fleet_server_port: "8220"

# User inputs can be overridden during command line run if needed, e.g., -e "fleet_server_service_token=XYZ"
fleet_server_service_token: ""
fleet_server_policy_id: ""
