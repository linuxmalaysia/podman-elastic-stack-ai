---
# ==============================================================================
# WSL2 Kernel Tuning & Advanced Tributary Performance Optimization Tasks
# Sourced from: https://www.thetributary.ai/blog/optimizing-wsl2-claude-code-performance-guide/
# Sourced from: https://linuxmalaysia.github.io/podman-elastic-stack-ai/WSL-3NODE-CLUSTER-GUIDE/
# ==============================================================================

- name: "Part A - Username Update (Dynamic Inventory & Variable Patching)"
  block:
    - name: Detect active username via whoami
      command: whoami
      register: whoami_out
      changed_when: false
      failed_when: false

    - name: Detect active username via id -un
      command: id -un
      register: id_out
      changed_when: false
      failed_when: false

    - name: Resolve active username
      set_fact:
        resolved_username: "{{ whoami_out.stdout | trim if (whoami_out.rc == 0 and whoami_out.stdout | trim != '') else (id_out.stdout | trim if (id_out.rc == 0 and id_out.stdout | trim != '') else 'your_username') }}"

    - name: Patch inventory hosts file placeholder
      replace:
        path: "{{ elk_base_dir }}/inventory/hosts.wsl.3node.yml"
        regexp: '"your_username"'
        replace: '"{{ resolved_username }}"'
      delegate_to: localhost
      when: resolved_username != 'your_username'
      failed_when: false

    - name: Override default variables if placeholder is active
      set_fact:
        ansible_user: "{{ resolved_username }}"
        dsom_group: "{{ resolved_username }}"
      when: ansible_user == 'your_username' or dsom_group == 'your_username'

- name: "Part B - Kernel Tuning check for vm.max_map_count"
  block:
    - name: Check current vm.max_map_count
      command: sysctl -n vm.max_map_count
      register: current_max_map_count
      changed_when: false
      failed_when: false

    - name: Parse max_map_count value
      set_fact:
        max_map_count_val: "{{ current_max_map_count.stdout | trim | int if (current_max_map_count.rc == 0 and current_max_map_count.stdout | trim is regex('^[0-9]+$')) else 0 }}"

    - name: Apply vm.max_map_count setting
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes
      become: true
      when: max_map_count_val | int < 262144

- name: "Part C - CPU and Memory Calculation suitable for host system"
  block:
    - name: Query Windows host hardware parameters via PowerShell if available
      shell: |
        powershell.exe -NoProfile -Command "(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory"
      register: win_mem_query
      changed_when: false
      failed_when: false

    - name: Calculate WSL processors and memory
      set_fact:
        wsl_processors: "{{ wsl_host_cpus | default(ansible_processor_vcpus | default(8)) }}"
        wsl_memory_gb: >-
          {% set ram_mb = ansible_memtotal_mb | default(16384) | int %}
          {% if ram_mb <= 16384 %}
            10
          {% elif ram_mb <= 32768 %}
            22
          {% elif ram_mb <= 65536 %}
            48
          {% else %}
            96
          {% endif %}

    - name: Ensure persistence directory exists
      file:
        path: "/opt/dsom-persistence"
        state: directory
        mode: "0755"
      become: true

    - name: Save tuned .wslconfig in persistence directory
      copy:
        content: |
          # WSL2 Performance Tuning Configuration
          [wsl2]
          memory={{ wsl_memory_gb }}GB
          processors={{ wsl_processors }}
          swap=16GB
          networkingMode=nat
          dnsTunneling=true
          autoProxy=true

          [experimental]
          autoMemoryReclaim=gradual
          sparseVhd=true
        dest: "/opt/dsom-persistence/wsl2_tuned.wslconfig"
        mode: "0644"
      become: true

    - name: Discover Windows user profiles
      command: find /mnt/c/Users -mindepth 1 -maxdepth 1 -type d ! -name "Public" ! -name "Default" ! -name "Default User" ! -name "All Users"
      register: windows_users
      changed_when: false
      failed_when: false

    - name: Write recommended .wslconfig for discovered Windows users
      copy:
        content: |
          # WSL2 Performance Tuning Configuration
          [wsl2]
          memory={{ wsl_memory_gb }}GB
          processors={{ wsl_processors }}
          swap=16GB
          networkingMode=nat
          dnsTunneling=true
          autoProxy=true

          [experimental]
          autoMemoryReclaim=gradual
          sparseVhd=true
        dest: "{{ item }}/.wslconfig.recommended"
        mode: "0644"
      loop: "{{ windows_users.stdout_lines | default([]) }}"
      ignore_errors: true

    - name: Write active .wslconfig only when explicit opt-in is enabled
      copy:
        content: |
          # WSL2 Active Performance Tuning Configuration
          [wsl2]
          memory={{ wsl_memory_gb }}GB
          processors={{ wsl_processors }}
          swap=16GB
          networkingMode=nat
          dnsTunneling=true
          autoProxy=true

          [experimental]
          autoMemoryReclaim=gradual
          sparseVhd=true
        dest: "{{ item }}/.wslconfig"
        mode: "0644"
      loop: "{{ windows_users.stdout_lines | default([]) }}"
      when: wsl_install_active_config | default(false) | bool
      ignore_errors: true

- name: "Part D - Adopt /etc/wsl.conf optimizations inside WSL"
  block:
    - name: Configure /etc/wsl.conf
      blockinfile:
        path: /etc/wsl.conf
        create: yes
        mode: "0644"
        block: |
          [boot]
          systemd=true

          [automount]
          enabled=true
          options=metadata,umask=22,fmask=11

          [network]
          generateHosts=true
          generateResolvConf=true

          [interop]
          enabled=true
          appendWindowsPath=true

          [gpu]
          enabled=true

          [time]
          useWindowsTimezone=true
      become: true

- name: "Part E - Adopt fs.inotify.max_user_watches tuning"
  block:
    - name: Check current fs.inotify.max_user_watches
      command: sysctl -n fs.inotify.max_user_watches
      register: current_inotify_watches
      changed_when: false
      failed_when: false

    - name: Parse inotify_watches value
      set_fact:
        inotify_watches_val: "{{ current_inotify_watches.stdout | trim | int if (current_inotify_watches.rc == 0 and current_inotify_watches.stdout | trim is regex('^[0-9]+$')) else 0 }}"

    - name: Apply fs.inotify.max_user_watches setting
      sysctl:
        name: fs.inotify.max_user_watches
        value: "524288"
        state: present
        reload: yes
      become: true
      when: inotify_watches_val | int < 524288

- name: "Part F - Adopt file descriptor limits optimization"
  block:
    - name: Configure file descriptor limits in /etc/security/limits.conf
      blockinfile:
        path: /etc/security/limits.conf
        block: |
          *  soft  nofile  65535
          *  hard  nofile  65535
      become: true
