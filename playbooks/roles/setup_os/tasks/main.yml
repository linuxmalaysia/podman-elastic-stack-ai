---
# ==============================================================================
# Ansible Role: setup_os
# Handles tasks requiring administrative privileges:
# - Package updates and installation
# - System tuning (sysctl, THP)
# - Security hardening and infrastructure baselines
# ==============================================================================

# --- [ PHASE 1: SYSTEM UPDATES ] ---

- name: "Foundation | Update OS package cache (Debian/Ubuntu)"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  when: ansible_facts['os_family'] == "Debian"

- name: "Foundation | Full OS upgrade (Debian/Ubuntu)"
  ansible.builtin.apt:
    upgrade: dist
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'os-upgrade' in ansible_run_tags"
  tags: ["os-upgrade"]

- name: "Foundation | Autoremove unused packages (Debian/Ubuntu)"
  ansible.builtin.apt:
    autoremove: yes
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  when:
    - ansible_facts['os_family'] == "Debian"
    - "'os-upgrade' in ansible_run_tags"
  tags: ["os-upgrade"]

- name: "Foundation | Update OS package cache and upgrade (RHEL/Alma/Rocky)"
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  when:
    - ansible_facts['os_family'] == "RedHat"
    - "'os-upgrade' in ansible_run_tags"
  tags: ["os-upgrade"]

# --- [ PHASE 2: TOOLCHAIN ] ---

- name: "Foundation | Install essential DSOM diagnostic and management tools"
  ansible.builtin.package:
    name:
      - git
      - tree
      - "{{ 'netcat-openbsd' if ansible_facts['os_family'] == 'Debian' else 'nmap-ncat' }}"
      - acl
      - curl
      - htop
      - vim
      - rsync
      - tcpdump
    state: present

# --- [ PHASE 3: KERNEL HARDENING ] ---

- name: "Foundation | Inject DSOM Optimised tuning drop-in"
  ansible.builtin.blockinfile:
    path: /etc/sysctl.d/99-dsom-tuning.conf
    block: "{{ lookup('template', 'sysctl.conf.j2') }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK (DSOM SOVEREIGN TUNING)"
    create: true
    mode: '0644'
  notify: reload sysctl

- name: "Foundation | Disable Transparent Huge Pages (THP)"
  ansible.builtin.shell: |
    if [ -f /sys/kernel/mm/transparent_hugepage/enabled ]; then
      echo never > /sys/kernel/mm/transparent_hugepage/enabled
    fi
    if [ -f /sys/kernel/mm/transparent_hugepage/defrag ]; then
      echo never > /sys/kernel/mm/transparent_hugepage/defrag
    fi
  changed_when: false
  failed_when: false

- name: "Foundation | Apply Security and Infrastructure Hardening"
  ansible.builtin.include_tasks: security_hardening.yml
