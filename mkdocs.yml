site_name: Podman Elastic Stack AI
site_description: An automated system to deploy Elasticsearch, Kibana, and Fleet Server using Podman and hardened Wolfi images.
site_author: Harisfazillah Jamel (LinuxMalaysia)
repo_url: https://github.com/linuxmalaysia/podman-elastic-stack-ai
site_url: https://linuxmalaysia.github.io/podman-elastic-stack-ai/
edit_uri: blob/main/docs/
copyright: 'All costs, designs, unit amounts, and scenarios detailed within this project are based entirely on assumptions. Compiled strictly for training, educational, and planning proposal purposes. Use at your own risk. We are not going to be responsible. We have done our best to protect anyone and organisation. <br> <a href="https://linuxmalaysia.github.io/podman-elastic-stack-ai/legal-notice/">Legal Notice, Privacy Policy, Critical Assumptions & Disclaimer of Liability</a> • Copyright &copy; 2025 - 2026 Harisfazillah Jamel (LinuxMalaysia)'

hooks:
  - scripts/mkdocs_hooks.py

exclude_docs: |
  !.agents

validation:
  links:
    absolute_links: warn
    unrecognized_links: ignore

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  palette:
    # Palette toggle for automatic mode based on system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.expand
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Installation Guide: INSTALL.md
  - Playbook Structure & Telemetry: PLAYBOOKS.md
  - Local Development & Feedback Guide: LOCAL_DEVELOPMENT_FEEDBACK_GUIDE.md
  - Rootless Podman 5+ & Quadlet Guide: PODMAN_ROOTLESS.md
  - Modern Ansible & FQCN Guide: ANSIBLE_FQCN.md
  - Ansible Adoption Review: ANSIBLE_ADOPTION_REVIEW.md
  - Playbook and Documents Map: ANSIBLE_PLAYBOOK_MAP.md
  - Local Knowledge-First Discovery SOP: SOP_KNOWLEDGE_FIRST_DISCOVERY.md
  - Sovereign Gitea Deployment & Security Operations Guide: GITEA_GUIDE.md
  - Sovereign SemaphoreUI Deployment & Operations Guide: SEMAPHORE_GUIDE.md
  - WSL 3-Node Cluster Guide: WSL-3NODE-CLUSTER-GUIDE.md
  - Upgrade Plan to Elastic 9.x: ELASTIC_9_UPGRADE_PLAN.md
  - Reference Tuning Resources: REFERENCE_TUNING.md
  - Developer Matrix Telemetry: DOCS_MATRIX_TELEMETRY.md
  - Legal Notice & Disclaimer: legal-notice.md
  - Project History: HISTORY.md
  - Changelog: CHANGELOG.md
